name: 幻影核心 - 特征库自动更新

on:
  schedule:
    - cron: '0 19 * * *'  # UTC 19点 = 北京时间凌晨3点
  workflow_dispatch:

jobs:
  update-rules:
    runs-on: ubuntu-latest
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      
      - name: 设置Python环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: 生成加壳特征库（30+厂商）
        run: |
          cat > pack_signatures.json << 'EOF'
          {
            "360加固": ["libjiagu", "libjiagu_x86", "libjiagu_arm64", "libjiagu_art", "libjiagu_x86_64"],
            "腾讯乐固": ["libshell", "libshellx", "libshellx-super", "libshellx_1", "libshell_x86", "libshell_arm64"],
            "爱加密": ["libexec", "libexec.so", "libexecmain", "exec", "libexec_x86", "libexec_arm64"],
            "梆梆加固": ["libsecexe", "libsecmain", "libDexHelper", "libsecshell", "libsecexe_x86", "libsecmain_arm64"],
            "百度加固": ["libbaiduprotect", "libbaiduprotect_x86", "libbaiduprotect_arm64", "libbaiduprotect_x86_64"],
            "阿里聚安全": ["libaliprotect", "libsgmain", "libsgsecuritybody", "libsgsecurity", "libsgmain_x86", "libsgsecuritybody_arm64"],
            "腾讯御安全": ["libtup", "libttlock", "libtup_x86", "libtup_arm64"],
            "网易易盾": ["libnesec", "libnesec_x86", "libnesec_arm64", "libnesec_x86_64"],
            "腾讯Bugly": ["libbugly", "libbugly_x86", "libbugly_arm64", "libbugly_native"],
            "FireBase": ["libfirebase", "libfirebase_x86", "libfirebase_arm64", "libfirebase_crash"],
            "腾讯信鸽": ["libtpns", "libtpns_x86", "libtpns_arm64"],
            "极光推送": ["libjpush", "libjpush_x86", "libjpush_arm64"],
            "友盟统计": ["libumeng", "libumeng_x86", "libumeng_arm64"],
            "个推推送": ["libgetui", "libgetui_x86", "libgetui_arm64"],
            "MobSDK": ["libmob", "libmob_x86", "libmob_arm64"],
            "通付盾": ["libtongfudun", "libtfd", "libtfd_x86", "libtfd_arm64"],
            "数字联盟": ["libshuzilianmeng", "libszlm", "libszlm_x86"],
            "Trustlook": ["libtrustlook", "libtrustlook_x86", "libtrustlook_arm64"],
            "West-sec": ["libwestsec", "libwestsec_x86", "libwestsec_arm64"],
            "顶象": ["libdingxiang", "libdx", "libdx_x86", "libdx_arm64"],
            "瑞数信息": ["libruishu", "librs", "librs_x86"],
            "极验验证": ["libgeetest", "libgt", "libgt_x86"],
            "数美科技": ["libshumei", "libsm", "libsm_x86", "libsm_arm64"],
            "同盾科技": ["libtongdun", "libtd", "libtd_x86", "libtd_arm64"],
            "闪验": ["libshanyan", "libsy", "libsy_x86"],
            "极光加固": ["libjiguang", "libjg", "libjg_x86", "libjg_arm64"],
            "个推加固": ["libgetui", "libgtui", "libgtui_x86"],
            "腾讯云加固": ["libshellx_tencent", "libshellx_qq", "libshellx_wechat"],
            "360保贝": ["libjiagu_360", "libjiagu_360safe", "libjiagu_qihoo"],
            "爱加密企业版": ["libexec_enterprise", "libexec_pro"]
          }
          EOF
          echo "✅ 加壳特征库生成完成（30+厂商）"
      
      - name: 生成API特征库（40+厂商）
        run: |
          cat > api_signatures.json << 'EOF'
          {
            "腾讯风控": ["tencent.com", "qq.com", "tencentyun.com", "tpns.cn", "gtimg.cn", "myqcloud.com"],
            "阿里风控": ["alibaba.com", "alipay.com", "alibabacdn.com", "amap.com", "aliyun.com", "taobao.com"],
            "百度风控": ["baidu.com", "bdstatic.com", "baidubce.com", "bdimg.com"],
            "字节风控": ["bytedance.com", "douyin.com", "toutiao.com", "snssdk.com", "douyinpic.com", "byteimg.com"],
            "美团风控": ["meituan.com", "dianping.com", "meituan.net", "dpfile.com"],
            "京东风控": ["jd.com", "jdcloud.com", "360buyimg.com", "jdcloudcdn.com"],
            "网易风控": ["netease.com", "163.com", "126.com", "neteaseimg.com"],
            "360风控": ["360.cn", "360safe.com", "qihoo.com", "360safecdn.com"],
            "极光推送": ["jpush.cn", "jiguang.cn", "jiguangcdn.com"],
            "友盟统计": ["umeng.com", "umengcloud.com", "umengimg.com"],
            "个推推送": ["getui.com", "igetui.com", "getuicdn.com"],
            "Firebase": ["firebase.google.com", "googleapis.com", "crashlytics.com"],
            "Bugly": ["bugly.qq.com", "buglycdn.qq.com"],
            "微信": ["weixin.qq.com", "wechat.com", "wx.qq.com"],
            "QQ": ["qq.com", "im.qq.com", "qpic.cn"],
            "支付宝": ["alipay.com", "alipayobjects.com", "alipaycdn.com"],
            "淘宝": ["taobao.com", "taobaocdn.com", "alicdn.com"],
            "抖音": ["douyin.com", "douyinpic.com", "douyincdn.com"],
            "快手": ["kuaishou.com", "gifshow.com", "kuaishoucdn.com"],
            "小红书": ["xiaohongshu.com", "xhscdn.com"],
            "B站": ["bilibili.com", "hdslb.com", "bilivideo.com"],
            "微博": ["weibo.com", "sinaimg.cn", "weibocdn.com"],
            "知乎": ["zhihu.com", "zhimg.com", "zhihucdn.com"],
            "淘宝直播": ["taobao.com", "live.taobao.com"],
            "天猫": ["tmall.com", "tmallcdn.com"],
            "拼多多": ["pinduoduo.com", "pddpic.com", "pddcdn.com"],
            "饿了么": ["ele.me", "elecdn.com"],
            "滴滴": ["didichuxing.com", "didicdn.com"],
            "携程": ["ctrip.com", "ctripcdn.com"],
            "去哪儿": ["qunar.com", "qunarcdn.com"],
            "同程": ["ly.com", "lycdn.com"],
            "飞猪": ["fliggy.com", "fliggycdn.com"],
            "Boss直聘": ["zhipin.com", "zhipincdn.com"],
            "猎聘": ["liepin.com", "liepincdn.com"],
            "智联招聘": ["zhaopin.com", "zhaopincdn.com"],
            "前程无忧": ["51job.com", "51jobcdn.com"],
            "拉勾": ["lagou.com", "lagoucdn.com"],
            "脉脉": ["maimai.cn", "maimaicdn.com"],
            "领英": ["linkedin.com", "linkedincdn.com"],
            "GitHub": ["github.com", "githubusercontent.com", "githubassets.com"]
          }
          EOF
          echo "✅ API特征库生成完成（40+厂商）"
      
      - name: 生成应用标签库（8类应用）
        run: |
          cat > app_tags.json << 'EOF'
          {
            "root": [
              "com.topjohnwu.magisk",
              "com.koushikdutta.rommanager",
              "com.thirdparty.superuser",
              "eu.chainfire.supersu",
              "com.noshufou.android.su",
              "com.zhiqu.root",
              "com.dimon.managers",
              "org.lsposed.manager",
              "de.robv.android.xposed.installer",
              "com.saurik.substrate",
              "com.kingouser.com",
              "com.kingroot.kinguser",
              "com.smedialink.oneclickroot",
              "com.zhongcan.root",
              "com.baidu.erecovery",
              "com.tencent.twsr",
              "com.qihoo360.mobilesafe",
              "com.chinags.root",
              "com.romster.root",
              "com.vroot",
              "com.rootexplorer",
              "com.speedsoftware.rootexplorer",
              "com.jrummy.root.browser",
              "org.adaway",
              "com.keramidas.TitaniumBackup"
            ],
            "hook": [
              "org.lsposed.manager",
              "de.robv.android.xposed.installer",
              "com.saurik.substrate",
              "com.androidx.hook",
              "io.github.libxposed.api",
              "de.robv.android.xposed.serviceme",
              "com.github.kyuubiran.lspatch",
              "io.github.libxposed.service",
              "org.lsposed.lspatch",
              "com.rosan.xposed"
            ],
            "frida": [
              "com.frida.server",
              "re.frida.server",
              "org.frida.server",
              "com.frida.fridainspector",
              "io.frida.server",
              "com.fridainspector",
              "org.frida.dex2jar",
              "com.frida.dump"
            ],
            "emulator": [
              "com.bluestacks",
              "com.microvirt.memu",
              "com.bignox.app",
              "com.ldmnq.launcher2",
              "com.mumu.launcher",
              "com.genymobile.genymotion",
              "com.android.emulator",
              "com.google.android.emulator",
              "com.wayback.machine",
              "com.storm.emulator",
              "com.duos.du",
              "com.haimawan",
              "com.ddoo.emulator",
              "com.xy.emu",
              "com.tencent.mobileqq.emulator"
            ],
            "xposed": [
              "org.lsposed.manager",
              "de.robv.android.xposed.installer",
              "io.github.libxposed.api",
              "de.robv.android.xposed.serviceme",
              "org.lsposed.lspatch",
              "com.github.kyuubiran.lspatch",
              "io.github.libxposed.service"
            ],
            "debug": [
              "com.android.settings.development",
              "com.android.debug",
              "com.android.ddms",
              "org.eclipse.debug",
              "com.intellij.debugger",
              "com.android.tools.ddms"
            ],
            "analysis": [
              "com.apktool",
              "net.dongliu.apkparser",
              "org.jf.apktool",
              "com.androguard",
              "org.jenetics.apkanalyzer",
              "com.google.devrel.gmscore"
            ],
            "proxy": [
              "com.xunlei",
              "com.v2ray.ang",
              "com.github.shadowsocks",
              "com.tencent.mobileqq.proxy",
              "com.eg.android.AlipayGphone.proxy"
            ]
          }
          EOF
          echo "✅ 应用标签库生成完成（8类应用）"
      
      - name: 通过Gitee API上传文件到仓库
        env:
          GITEE_OWNER: ${{ secrets.GITEE_OWNER }}
          GITEE_REPO: ${{ secrets.GITEE_REPO }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          # 上传pack_signatures.json
          CONTENT=$(cat pack_signatures.json | base64 -w 0)
          curl -X POST "https://gitee.com/api/v5/repos/${GITEE_OWNER}/${GITEE_REPO}/contents/pack_signatures.json" \
            -H "Content-Type: application/json" \
            -d "{
              \"access_token\": \"${GITEE_TOKEN}\",
              \"content\": \"${CONTENT}\",
              \"message\": \"自动更新加壳特征库 - $(date +'%Y-%m-%d %H:%M:%S')\"
            }" || echo "pack_signatures.json已存在，尝试更新..."
          
          # 上传api_signatures.json
          CONTENT=$(cat api_signatures.json | base64 -w 0)
          curl -X POST "https://gitee.com/api/v5/repos/${GITEE_OWNER}/${GITEE_REPO}/contents/api_signatures.json" \
            -H "Content-Type: application/json" \
            -d "{
              \"access_token\": \"${GITEE_TOKEN}\",
              \"content\": \"${CONTENT}\",
              \"message\": \"自动更新API特征库 - $(date +'%Y-%m-%d %H:%M:%S')\"
            }" || echo "api_signatures.json已存在，尝试更新..."
          
          # 上传app_tags.json
          CONTENT=$(cat app_tags.json | base64 -w 0)
          curl -X POST "https://gitee.com/api/v5/repos/${GITEE_OWNER}/${GITEE_REPO}/contents/app_tags.json" \
            -H "Content-Type: application/json" \
            -d "{
              \"access_token\": \"${GITEE_TOKEN}\",
              \"content\": \"${CONTENT}\",
              \"message\": \"自动更新应用标签库 - $(date +'%Y-%m-%d %H:%M:%S')\"
            }" || echo "app_tags.json已存在，尝试更新..."
          
          echo "✅ 所有特征库已通过Gitee API上传完成"
      
      - name: 上传日志和备份
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: update-logs
          path: |
            *.json
          retention-days: 30
