name: 幻影核心 - 特征库自动更新

# 触发条件：
# 1. 每天凌晨3点自动运行（北京时间）
# 2. 手动点击运行
on:
  schedule:
    - cron: '0 19 * * *'  # UTC时间19点 = 北京时间凌晨3点
  workflow_dispatch:  # 手动触发

jobs:
  update-rules:
    runs-on: ubuntu-latest
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      
      - name: 设置Python环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: 下载自动更新脚本
        run: |
          mkdir -p auto_update
          cd auto_update
          # 这里需要把你的脚本上传到这个仓库，或者从其他地方下载
          # 如果你把脚本放在这个仓库的auto_update目录下，这步可以跳过
          echo "脚本已在仓库中"
      
      - name: 生成配置文件
        run: |
          cd auto_update
          cat > config.json << 'EOF'
          {
            "gitee": {
              "owner": "${{ secrets.GITEE_OWNER }}",
              "repo": "${{ secrets.GITEE_REPO }}",
              "branch": "master",
              "file_path": "risk_rules.json",
              "access_token": "${{ secrets.GITEE_TOKEN }}"
            },
            "sources": {
              "github_safety_repos": [
                "https://raw.githubusercontent.com/securevale/android-rasp/master/native/src/common/package.rs",
                "https://raw.githubusercontent.com/scottyab/rootbeer/master/rootbeer-lib/src/main/java/com/scottyab/rootbeer/RootBeer.java",
                "https://gist.githubusercontent.com/p0intsec/dc709d7c45311c679be1c3afa75fd516/raw/",
                "https://gist.githubusercontent.com/SurajBahadur/b0848032b60ea118e76cd1abb1103551/raw/",
                "https://gist.githubusercontent.com/rhonyabdullah/4eca44779783c22160cbd60ebce51318/raw/",
                "https://raw.githubusercontent.com/framgia/android-emulator-detector/master/library/src/main/java/com/framgia/android/emulator/EmulatorDetector.java"
              ],
              "custom_packages": [],
              "custom_permissions": []
            },
            "settings": {
              "auto_mode": true,
              "version_bump": true,
              "backup_before_update": true,
              "log_file": "auto_update.log"
            }
          }
          EOF
          echo "配置文件生成完成"
      
      - name: 运行自动更新脚本
        run: |
          cd auto_update
          python auto_update_rules.py
      
      - name: 上传日志和备份
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: update-logs
          path: |
            auto_update/auto_update.log
            auto_update/backup_*.json
          retention-days: 30
      
      - name: 发送结果通知（可选）
        run: |
          echo "自动更新完成！查看日志了解详情。"
          # 如果需要微信/钉钉通知，可以在这里加webhook
                - name: 自动同步app_update.json到Gitee
        run: |
          echo "正在同步app_update.json到Gitee..."
          
          # 读取GitHub上的app_update.json
          CONTENT=$(base64 -w 0 app_update.json)
          
          # 用Gitee API更新文件
          curl -X PUT \
            "https://gitee.com/api/v5/repos/werel666/phantom-rules/contents/app_update.json" \
            -H "Content-Type: application/json" \
            -d '{
              "access_token": "你的Gitee访问令牌",
              "content": "'"$CONTENT"'",
              "message": "自动同步APP更新信息到Gitee"
            }'
          
          echo "同步完成！"

